name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL: skip
      ONEOCR_MODEL_PATH: models/oneocr.onemodel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Build image with bundled model
        run: docker build -t oneocr-next:ci .
      - name: Start Compose service
        env:
          ONEOCR_API_KEY: ci-only-placeholder-not-a-real-key-00000000
          ONEOCR_IMAGE: oneocr-next:ci
          ONEOCR_MODEL_PATH: /app/models/oneocr.onemodel
        run: docker compose up -d --no-build --wait --wait-timeout 120
      - name: Verify actual service OCR, auth and OpenAPI
        env:
          ONEOCR_API_KEY: ci-only-placeholder-not-a-real-key-00000000
        run: npm run test:service
      - name: Stop Compose service
        if: always()
        env:
          ONEOCR_API_KEY: ci-only-placeholder-not-a-real-key-00000000
        run: docker compose down
  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
      - name: Build and publish Linux amd64 image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}"
          docker build --label "org.opencontainers.image.revision=$REVISION" -t "$IMAGE:sha-$REVISION" .
          docker push "$IMAGE:sha-$REVISION"
          if [ "$REF_TYPE" = tag ]; then
            docker tag "$IMAGE:sha-$REVISION" "$IMAGE:$REF_NAME"
            docker push "$IMAGE:$REF_NAME"
          else
            docker tag "$IMAGE:sha-$REVISION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
