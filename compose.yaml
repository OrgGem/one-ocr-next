name: one-ocr-next
services:
  ocr:
    image: ${ONEOCR_IMAGE:-oneocr-next:local}
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    init: true
    restart: unless-stopped
    ports:
      - "${ONEOCR_BIND_ADDRESS:-127.0.0.1}:${ONEOCR_PUBLISHED_PORT:-8001}:8001"
    environment:
      ONEOCR_HOST: 0.0.0.0
      ONEOCR_PORT: 8001
      ONEOCR_MODEL_PATH: ${ONEOCR_MODEL_PATH:-/app/models/oneocr.onemodel}
      ONEOCR_API_KEY: ${ONEOCR_API_KEY:?Run node tools/init-service.mjs to generate .env}
      ONEOCR_THREADS: ${ONEOCR_THREADS:-2}
      ONEOCR_MAX_PENDING: ${ONEOCR_MAX_PENDING:-8}
      ONEOCR_MAX_BODY_BYTES: ${ONEOCR_MAX_BODY_BYTES:-20971520}
      ONEOCR_MAX_PIXELS: ${ONEOCR_MAX_PIXELS:-40000000}
      ONEOCR_REQUEST_TIMEOUT_MS: ${ONEOCR_REQUEST_TIMEOUT_MS:-60000}
      ONEOCR_SHUTDOWN_TIMEOUT_MS: ${ONEOCR_SHUTDOWN_TIMEOUT_MS:-65000}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: ${ONEOCR_MEMORY_LIMIT:-2g}
    cpus: ${ONEOCR_CPUS:-2}
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
